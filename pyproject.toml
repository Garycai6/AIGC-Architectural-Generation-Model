[project]
name = "archgen"
version = "0.1.0"
description = "建筑 AIGC 生成模型 - 参数驱动的建筑方案生成 SaaS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",          # DeepSeek 兼容 OpenAI SDK
    "replicate>=1.0",
    "fal-client>=0.7,<1.0",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",           # FastAPI TestClient 依赖
]
gpu = [
    "torch>=2.2",
    "diffusers>=0.29",
    "accelerate>=0.33",
    "peft>=0.12",
]

[project.scripts]
archgen-api = "backend.app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "generation", "data", "training"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/"]  # 文档内代码块不受 ruff 格式约束

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
